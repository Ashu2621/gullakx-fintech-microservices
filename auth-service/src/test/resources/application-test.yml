spring:
  datasource:
    url: jdbc:h2:mem:gullakx_auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

gullakx:
  jwt:
    secret: test-secret-that-is-definitely-long-enough-for-hs256
    ttl-minutes: 60
    issuer: gullakx-auth-test

logging:
  level:
    org.hibernate.SQL: WARN

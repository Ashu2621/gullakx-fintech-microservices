server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  data:
    redis:
      host: localhost
      port: 6379
      password: gullakx_redis_secret
  
  cloud:
    gateway:
      routes:
        # Auth Service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=1
        
        # Wallet Service
        - id: wallet-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/wallets/**
          filters:
            - StripPrefix=1
      
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.gullakx: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# H2 in PostgreSQL compatibility mode.
#
# The production database is PostgreSQL. Tests run against H2 so that
# `mvn test` works on a clean checkout with no Docker daemon and no local
# Postgres — the cost of that choice is stated in the README, not hidden:
# H2 honours SELECT ... FOR UPDATE and the CHECK constraints, which is what
# these tests assert on, but it is not byte-for-byte PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:gullakx;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    com.gullakx: INFO

gullakx:
  events:
    kafka:
      enabled: false
    # Effectively never on the timer; the tests drain the outbox explicitly so
    # they assert on a state they created rather than racing a scheduler.
    dispatch-interval-ms: 3600000
  jwt:
    secret: test-secret-that-is-definitely-long-enough-for-hs256
    issuer: gullakx-auth-test

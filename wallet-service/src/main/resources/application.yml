server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: wallet-service
  
  datasource:
    url: jdbc:postgresql://localhost:5433/gullakx_wallet
    username: gullakx
    password: gullakx_secret
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  data:
    redis:
      host: localhost
      port: 6379
      password: gullakx_redis_secret
    cache:
      type: redis
      redis:
        time-to-live: 3600000  # 1 hour
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.gullakx: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

gullakx:
  events:
    # Off by default so the service starts without a broker. Turn on in any
    # environment that has one; the outbox is written either way, so switching
    # this on later publishes the backlog rather than losing it.
    kafka:
      enabled: ${KAFKA_ENABLED:false}
      topic: wallet.events
    dispatch-interval-ms: 2000
  jwt:
    # The same secret and issuer the auth service signs with. This shared secret
    # is the cost of HS256 - see common/JwtVerifier for the condition that would
    # make RS256 with a published JWKS the better trade.
    secret: ${JWT_SECRET:local-development-secret-not-for-production-use}
    issuer: gullakx-auth

spring:
  datasource:
    url: jdbc:h2:mem:gullakx_statement;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

gullakx:
  events:
    kafka:
      # The listener stays off; the projector is exercised directly, which is
      # where the behaviour worth testing lives.
      enabled: false
